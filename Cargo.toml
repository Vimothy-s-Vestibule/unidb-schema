[package]
name = "unidb"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Creative-Difficulty"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ormlite = { version = "0.24.3", features = ["postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
# Integration tests (tests/) create throwaway databases on the server named by
# UNIDB_TEST_DATABASE_URL, load schema/*.sql and check the Rust models against
# the live catalog. See tests/common/mod.rs.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
